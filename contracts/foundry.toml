[profile.default]
solc_version = "0.8.24"
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.optimizer_details]
# keep it simple; via_ir already on for low-vars contracts

# Monad testnet — chain id 10143, gas token MON
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONAD_TESTNET_ETHERSCAN_KEY}", chain = 10143 }
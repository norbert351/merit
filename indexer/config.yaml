# Envio HyperIndex config — Merit settled-receipt graph on Monad testnet.
#
# This is the on-chain re-derivability layer: every settled x402 receipt emitted by the
# MeritReputation contract is indexed into a queryable graph, so ANY stranger can recompute
# an agent's Merit score from on-chain data alone (no trust in our server).
#
#   npx envio dev      # local, against the deployed MeritReputation on Monad testnet
#   npx envio deploy   # Envio Cloud hosting (the $5K bounty target)
#
# Docs: https://docs.envio.dev
name: merit-receipt-graph
description: Merit — sybil-resistant, settled-money-weighted agent reputation (Monad Metropolis Track 04)

# Monad testnet (chain 10143) — the Merit contract suite deployment network.
networks:
  - id: 10143
    start_block: 0
    contracts:
      - name: MeritReputation
        address:
          - "0x92A11Ad0E988C6cd0Bd434e140331A620393114D"
        handler: src/EventHandlers.ts
        events:
          - event: ReceiptRecorded(indexed uint256 agentId, indexed address payer, uint64 amountMicroUsd, bool verified, bool delivered, bytes32 deliverableHash, uint256 scoreAfter, bool sybilDetected)
          - event: SybilClusterSuppressed(indexed uint256 agentId, uint256 clusterSize, uint256 suppressedMicroUsd)

# GraphQL schema + generated code
schema: schema.graphql
# The generated code lives here (regenerated by `envio codegen`)
generated: src/generated

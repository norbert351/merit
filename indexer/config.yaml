# Envio HyperIndex config — Merit settled-receipt graph on Monad testnet.
#
# This is the on-chain re-derivability layer: every settled x402 receipt emitted by the
# MeritReputation contract is indexed into a queryable graph, so ANY stranger can recompute
# an agent's Merit score from on-chain data alone (no trust in our server).
#
#   npx envio dev      # local indexing against the deployed MeritReputation on Monad testnet
#                      # (needs ENVIO_API_TOKEN in indexer/.env — HyperSync access)
# Hosted deploy = Envio Cloud (GitHub App) or the envio-cloud CLI — NOT `envio deploy`:
#   dashboard: https://envio.dev/app  (install "Envio Deployments GitHub App" → connect repo)
#   CLI:       npm i -g envio-cloud && envio-cloud login && envio-cloud deploy
# Docs: https://docs.envio.dev/docs/HyperIndex/hosted-service
name: merit-receipt-graph
description: Merit — sybil-resistant, settled-money-weighted agent reputation (Monad Metropolis Track 04)

# Monad testnet (chain 10143) — the Merit contract suite deployment network.
networks:
  - id: 10143
    start_block: 0
    rpc_config:
      url: https://testnet-rpc.monad.xyz
    contracts:
      - name: MeritReputation
        address:
          - "0x92A11Ad0E988C6cd0Bd434e140331A620393114D"
        handler: src/EventHandlers.ts
        events:
          - event: ReceiptRecorded(uint256 agentId, address payer, uint64 amountMicroUsd, bool verified, bool delivered, bytes32 deliverableHash, uint256 scoreAfter, bool sybilDetected)
          - event: SybilClusterSuppressed(uint256 agentId, uint256 clusterSize, uint256 suppressedMicroUsd)

# GraphQL schema
schema: schema.graphql
